databaseChangeLog:
  - changeSet:
      id: add-indexes
      author: rabenok
      changes:
        - createIndex:
            indexName: idx_users_email
            tableName: users
            columns:
              - column:
                  name: email

        - createIndex:
            indexName: idx_payment_cards_user_id
            tableName: payment_cards
            columns:
              - column:
                  name: user_id

        - createIndex:
            indexName: idx_payment_cards_number
            tableName: payment_cards
            columns:
              - column:
                  name: number